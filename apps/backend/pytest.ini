[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    online: tests that require external network (OpenRouter / social APIs / market data)
    pg: tests that require a real Postgres + pgvector instance (set DRILL_PG_URL env)

; NOTE: env_files 是 pytest-env 插件专属选项；当前未安装该插件（会产生 "Unknown config option" warning）
; 环境变量改由 tests/conftest.py 手动加载 .env.test
